<svg width="325" height="128" viewBox="0 0 325 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Hintergrundgradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="100%" stop-color="#eee" />
    </linearGradient>

    <!-- CD-Verlauf -->
    <linearGradient id="cdDarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3cd" />
      <stop offset="100%" stop-color="#306" />
    </linearGradient>

    <!-- ClipPath -->
    <clipPath id="cdClip">
      <circle cx="64" cy="64" r="50" />
    </clipPath>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hintergrund: Breite an viewBox angepasst (325 statt 400) -->
  <rect width="325" height="128" rx="16" fill="url(#bgGradient)" />

  <!-- Logo Gruppe -->
  <g filter="url(#dropShadow)">
    <circle cx="64" cy="64" r="50" fill="url(#cdDarkGradient)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Animation -->
    <g fill="white" fill-opacity="0.2" clip-path="url(#cdClip)">
      <polygon points="44,14 84,14 64,64" />
      <polygon points="44,114 84,114 64,64" />
      <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="6s" repeatCount="indefinite" />
    </g>
    
    <!-- Play-Button -->
    <circle cx="64" cy="64" r="24" fill="#ffffff" opacity="0.95" />
    <polygon points="59,55 59,73 75,64" fill="#306" stroke="#306" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Text Gruppe -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="138" y="46" font-weight="bold" font-size="24" fill="#569" letter-spacing="4">
      MEDIA
    </text>
    <text x="135" y="96" font-weight="900" font-size="64" fill="#306" letter-spacing="-1">
      DECK
    </text>
  </g>
</svg>