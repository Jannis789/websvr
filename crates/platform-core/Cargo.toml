[package]
name = "platform-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17.14"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sea-orm = "1.1"
tokio = { version = "1", features = ["sync"] }
