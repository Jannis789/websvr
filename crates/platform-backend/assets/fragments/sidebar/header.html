<div class="sidebar-header">
    <img
        class="logo"
        src="/assets/icons/logo.svg"
        data-attr:alt="$app_name"
    />
    <span
        class="sidebar-title"
        data-text="$app_brand"
    ></span>
    <button
        class="sidebar-close"
        data-on:click="$sidebarOpen=false"
        data-attr:aria-label="$aria_close"
    >
        <span class="icon icon-pan-start"></span>
    </button>
</div>
