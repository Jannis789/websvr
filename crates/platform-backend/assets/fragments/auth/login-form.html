<div
    class="auth-card"
    data-class:is-leaving="$success"
>
    <div class="auth-card-header">
        <span
            class="icon icon-person auth-card-icon"
            role="img"
            aria-hidden="true"
        ></span>
        <h1 data-text="$login_title">
        </h1>
        <p
            class="auth-card-subtitle"
            data-text="$login_subtitle"
        >
        </p>
    </div>

    <div
        data-show="$errors.error"
        class="form-message message-error"
        data-text="$errors.error"
    >
    </div>

    <form
        class="auth-form"
        data-on:submit="console.log('[login] submit event fired', Date.now());$errors='';$submitting=true;@post('/login')"
    >
        <div class="input-stack">
            <div class="floating-group">
                <div class="input-wrapper">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        data-bind:email
                        placeholder=" "
                    />
                    <label
                        for="email"
                        data-text="$login_email"
                    ></label>
                </div>
                <div
                    class="field-error"
                    data-show="$errors.email"
                    data-text="$errors.email"
                >
                </div>
            </div>
            <div class="floating-group">
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        data-bind:password
                        placeholder=" "
                    />
                    <label
                        for="password"
                        data-text="$login_password"
                    ></label>
                </div>
                <div
                    class="field-error"
                    data-show="$errors.password"
                    data-text="$errors.password"
                >
                </div>
            </div>
            <div class="floating-group">
                <div class="input-wrapper remember-wrapper">
                    <label class="switch-label">
                        <span data-text="$login_remember"></span>
                        <div
                            class="theme-switch remember-switch"
                            data-on:click="$remember_me=!$remember_me"
                        >
                            <div
                                class="slider"
                                data-class:checked="$remember_me"
                            ></div>
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <button
            type="submit"
            class="btn btn-primary auth-submit"
            data-on:click="$submitting=true"
            data-class:is-loading="$submitting && !$success"
            data-class:is-success="$success"
        >
            <span
                data-show="!$submitting && !$success"
                data-text="$login_submit"
            ></span>
            <span
                class="loading-text"
                data-show="$submitting && !$success"
            ><span data-text="$login_submit"></span><span
                    class="loading-dots"
                ><span></span><span></span><span></span></span></span>
            <span
                class="success-check"
                data-show="$success"
            ><span
                    class="icon icon-circle-check"
                ></span></span>
        </button>
    </form>

    <div class="auth-card-footer">
        <a
            href="/register"
            class="auth-link"
        ><span data-text="$login_create_account"></span></a>
    </div>
</div>
