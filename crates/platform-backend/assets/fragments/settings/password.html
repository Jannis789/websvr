<div class="settings-section">
    <h2 class="settings-title" data-text="$settings_password_change"></h2>

    <div
        data-show="$errors.error"
        class="form-message message-error"
        data-text="$errors.error"
        style="display: none"
    >
    </div>
    <div
        data-show="$settingsSuccess"
        class="form-message message-success"
        data-text="$settingsSuccess"
        style="display: none"
    >
    </div>

    <form
        class="settings-form"
        data-on:submit="$errors=''; @post('/settings/password')"
    >
        <div class="form-group">
            <label for="current-password"
            data-text="$settings_current_password"></label>
            <input
                type="password"
                id="current-password"
                name="current_password"
                required=""
                data-bind:current_password=""
            >
            <div
                class="field-error"
                data-show="$errors.current_password"
                data-text="$errors.current_password"
                style="display: none"
            >
            </div>
        </div>
        <div class="form-group">
            <label for="new-password" data-text="$settings_new_password"></label>
            <input
                type="password"
                id="new-password"
                name="new_password"
                required=""
                data-bind:new_password=""
            >
            <div
                class="field-error"
                data-show="$errors.new_password"
                data-text="$errors.new_password"
                style="display: none"
            >
            </div>
        </div>
        <div class="form-group">
            <label for="confirm-password"
            data-text="$settings_confirm_password"></label>
            <input
                type="password"
                id="confirm-password"
                name="confirm_password"
                required=""
                data-bind:confirm_password=""
            >
            <div
                class="field-error"
                data-show="$errors.confirm_password"
                data-text="$errors.confirm_password"
                style="display: none"
            >
            </div>
        </div>
        <button
            type="submit"
            class="btn btn-primary"
        >
            <span data-text="$settings_password_change"></span>
        </button>
    </form>
</div>
