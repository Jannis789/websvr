<div class="settings-section">
    <h2
        class="settings-title"
        data-text="$settings_email_change"
    >
    </h2>
    <p class="settings-desc">
        <span data-text="$settings_email_current"></span>
        <strong>john@example.com</strong>
    </p>

    <div
        data-show="$errors.error"
        class="form-message message-error"
        data-text="$errors.error"
        style="display: none"
    >
    </div>
    <div
        data-show="$settingsSuccess"
        class="form-message message-success"
        data-text="$settingsSuccess"
        style="display: none"
    >
    </div>

    <form
        class="settings-form"
        data-on:submit="$errors=''; @post('/settings/email')"
    >
        <div class="form-group">
            <label
                for="new-email"
                data-text="$settings_email_new"
            ></label>
            <input
                type="email"
                id="new-email"
                name="new_email"
                required=""
                data-bind:new_email=""
            >
            <div
                class="field-error"
                data-show="$errors.new_email"
                data-text="$errors.new_email"
                style="display: none"
            >
            </div>
        </div>
        <div class="form-group">
            <label
                for="current-password"
                data-text="$settings_current_password"
            ></label>
            <input
                type="password"
                id="current-password"
                name="current_password"
                required=""
                data-bind:current_password=""
            >
            <div
                class="field-error"
                data-show="$errors.current_password"
                data-text="$errors.current_password"
                style="display: none"
            >
            </div>
        </div>
        <button
            type="submit"
            class="btn btn-primary"
        >
            <span data-text="$settings_email_change"></span>
        </button>
    </form>
</div>
