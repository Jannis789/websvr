<div class="settings-section">
    <h2 class="settings-title" data-text="$settings_username_change"></h2>
    <p class="settings-desc">
        <span data-text="$settings_username_current"></span> <strong>John Doe</strong>
    </p>

    <div
        data-show="$errors.error"
        class="form-message message-error"
        data-text="$errors.error"
        style="display: none"
    >
    </div>
    <div
        data-show="$settingsSuccess"
        class="form-message message-success"
        data-text="$settingsSuccess"
        style="display: none"
    >
    </div>

    <form
        class="settings-form"
        data-on:submit="$errors=''; @post('/settings/username')"
    >
        <div class="form-group">
            <label for="new-username"
            data-text="$settings_username_new"></label>
            <input
                type="text"
                id="new-username"
                name="new_username"
                required=""
                data-bind:new_username=""
            >
            <div
                class="field-error"
                data-show="$errors.new_username"
                data-text="$errors.new_username"
                style="display: none"
            >
            </div>
        </div>
        <div class="form-group">
            <label for="current-password"
            data-text="$settings_current_password"></label>
            <input
                type="password"
                id="current-password"
                name="current_password"
                required=""
                data-bind:current_password=""
            >
            <div
                class="field-error"
                data-show="$errors.current_password"
                data-text="$errors.current_password"
                style="display: none"
            >
            </div>
        </div>
        <button
            type="submit"
            class="btn btn-primary"
        >
            <span data-text="$settings_username_change"></span>
        </button>
    </form>
</div>
