<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >
        <link
            rel="icon"
            type="image/svg+xml"
            href="/assets/icons/logo.svg"
        >
        <title>Rama Platform</title>
        <link
            rel="stylesheet"
            href="/assets/css/pages/home.css"
        >
        <script
            type="module"
            src="/assets/js/datastar.js"
        ></script>
        <script
            type="module"
            src="/assets/js/ds-cache.js"
        ></script>
        <script>
        if ('serviceWorker' in navigator) {
          // SW message listener — logs SW messages in normal page console
          navigator.serviceWorker.addEventListener('message', (evt) => {
            if (evt.data?.type === 'sw-log') {
              console.log('[sw]', ...evt.data.args);
            }
          });
          navigator.serviceWorker.register('/sw2.js', {
            scope: '/',
            updateViaCache: 'none',
          });

          }
        </script>
    </head>
    <body data-class:light-mode="$lightMode">
        <div class="app-layout">
            <div id="sidebar-slot">
            </div>

            <main class="main-container">
                <div id="header-slot">
                </div>
                <div id="content-slot">
                </div>
            </main>
        </div>
<div data-init="@get('/sse')"
     data-on:beforeunload__window="console.log('beforeunload: page closing')"
     data-on:visibilitychange__document="if (document.hidden) { navigator.serviceWorker?.controller?.postMessage({ type: 'sse-close' }); } else { navigator.serviceWorker?.controller?.postMessage({ type: 'sse-open' }); }">

        </div>
    </body>
</html>
