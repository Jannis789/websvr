<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rama Platform</title>
  <link rel="stylesheet" href="/assets/css/pages/home.css">
  <script type="module" src="/assets/js/datastar-core.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' });
    }
  </script>
</head>
<body data-signals="{activePage:'overview',popupOpen:false,lightMode:false}" data-class:light-mode="$lightMode">

  <div class="app-layout">

    <!-- ═══ Sidebar ═══ -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <span class="icon icon-display" role="img" aria-hidden="true"></span>
          <span class="sidebar-title">Rama</span>
        </div>

        <ul class="sidebar-menu">
          <li class="menu-item"
              data-class:active="$activePage === 'overview'"
              data-on:click="$activePage = 'overview'; @get('/home/overview', {selector:'.content-body'})">
            <span class="icon icon-view-grid" role="img" aria-hidden="true"></span>
            <span class="nav-label">Overview</span>
          </li>
          <li class="menu-item"
              data-class:active="$activePage === 'movies'"
              data-on:click="$activePage = 'movies'; @get('/home/movies', {selector:'.content-body'})">
            <span class="icon icon-video" role="img" aria-hidden="true"></span>
            <span class="nav-label">Movies</span>
          </li>
          <li class="menu-item"
              data-class:active="$activePage === 'series'"
              data-on:click="$activePage = 'series'; @get('/home/series', {selector:'.content-body'})">
            <span class="icon icon-tv" role="img" aria-hidden="true"></span>
            <span class="nav-label">Series</span>
          </li>
        </ul>
      </div>

      <!-- ═══ Sidebar Footer ═══ -->
      <div class="sidebar-footer">
        <div class="user-profile">
          <span class="avatar icon icon-person" role="img" aria-hidden="true"></span>
          <span class="username">John Doe</span>
        </div>
        <button class="settings-btn"
                data-class:active="$popupOpen"
                data-on:click="$popupOpen = !$popupOpen">
          <span class="icon icon-open-menu" role="img" aria-hidden="true"></span>
        </button>
        <div class="popup-overlay"
             data-show="$popupOpen"
             data-on:click="$popupOpen = false"></div>
        <ul class="popup-menu" data-show="$popupOpen">
          <li class="popup-item" data-on:click="$popupOpen = false">
            <span class="icon icon-shield" role="img" aria-hidden="true"></span>
            Sicherheit
          </li>
          <li class="popup-item popup-item--danger">
            <form method="post" action="/logout" class="popup-form">
              <button type="submit" class="popup-btn" data-on:click="$popupOpen = false">
                <span class="icon icon-exit" role="img" aria-hidden="true"></span>
                Abmelden
              </button>
            </form>
          </li>
        </ul>
      </div>
    </aside>

    <!-- ═══ Main Content ═══ -->
    <main class="main-container">
      <header class="main-header">
        <div class="header-title">Rama Platform</div>
        <div class="theme-switch-wrapper">
          <label class="theme-switch">
            <input type="checkbox" data-bind:lightMode />
            <div class="slider">
              <span class="icon icon-moon switch-icon" role="img" aria-hidden="true"></span>
              <span class="icon icon-sun switch-icon" role="img" aria-hidden="true"></span>
            </div>
          </label>
        </div>
      </header>

      <div class="content-body">
        <div class="placeholder-state">
          <span class="icon icon-go-home placeholder-icon" role="img" aria-hidden="true"></span>
          <p>Select a section from the sidebar.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Persistent SSE stream -->
  <div data-init="@get('/sse')"></div>

</body>
</html>
