<!DOCTYPE html>
<html lang="en" data-signals>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — Rama Platform</title>
  <link rel="stylesheet" href="/assets/css/dark.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/assets/css/light.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/assets/css/common.css">
  <script type="module" src="/assets/js/datastar-core.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' });
    }
  </script>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <h2 class="sidebar-title">Rama</h2>
      </header>

      <nav class="sidebar-nav">
        <button
          class="nav-item"
          data-on:click="@get('/home/overview', {selector: '.content-body'})"
        >
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Overview</span>
        </button>

        <div class="nav-section">
          <span class="nav-section-title">Library</span>

          <button
            class="nav-item"
            data-on:click="@get('/home/movies', {selector: '.content-body'})"
          >
            <span class="nav-icon">🎬</span>
            <span class="nav-label">Movies</span>
          </button>

          <button
            class="nav-item"
            data-on:click="@get('/home/series', {selector: '.content-body'})"
          >
            <span class="nav-icon">📺</span>
            <span class="nav-label">Series</span>
          </button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <span class="nav-item">
          <span class="nav-icon">👤</span>
          <span class="nav-label">User</span>
        </span>
        <form method="post" action="/logout" style="display:inline">
          <button type="submit" class="btn btn-ghost btn-logout">
            <span class="nav-icon">🚪</span>
            <span class="nav-label">Logout</span>
          </button>
        </form>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="content-header">
        <h1>Overview</h1>
      </header>
      <div class="content-body">
        <h2>Welcome</h2>
        <p>Select a section from the sidebar to get started.</p>
      </div>
    </main>
  </div>

  <!-- Persistent SSE stream for real-time updates -->
  <div data-init="@get('/sse')"></div>
</body>
</html>
