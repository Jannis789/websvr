<!DOCTYPE html>
<html lang="de" data-signals="activePage:'overview',popupOpen:false" data-class:light-mode="$lightMode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rama Platform</title>
  <link rel="stylesheet" href="/assets/css/home.css">
  <script type="module" src="/assets/js/datastar-core.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' });
    }
  </script>
</head>
<body>

  <div class="app-layout">

    <!-- ═══ Sidebar ═══ -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <div class="logo-placeholder">
            <div class="logo-icon"></div>
            <span>Rama</span>
          </div>
        </div>

        <ul class="sidebar-menu">
          <li class="menu-item"
              data-class:active="$activePage === 'overview'"
              data-on:click="$activePage = 'overview'; @get('/home/overview', {selector:'.content-body'})">
            <div class="dot-icon"></div>
            Overview
          </li>
          <li class="menu-item"
              data-class:active="$activePage === 'movies'"
              data-on:click="$activePage = 'movies'; @get('/home/movies', {selector:'.content-body'})">
            <div class="dot-icon"></div>
            Movies
          </li>
          <li class="menu-item"
              data-class:active="$activePage === 'series'"
              data-on:click="$activePage = 'series'; @get('/home/series', {selector:'.content-body'})">
            <div class="dot-icon"></div>
            Series
          </li>
        </ul>
      </div>

      <!-- ═══ Sidebar Footer ═══ -->
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="avatar">JD</div>
          <div class="username">John Doe</div>
        </div>

        <button class="settings-btn"
                data-class:active="$popupOpen"
                data-on:click="$popupOpen = !$popupOpen">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 9.87c-.12.22-.07.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>

        <!-- Popup overlay (closes on click) -->
        <div class="popup-overlay"
             data-show="$popupOpen"
             data-on:click="$popupOpen = false"></div>

        <ul class="popup-menu" data-show="$popupOpen">
          <li class="popup-item" data-on:click="$popupOpen = false">Konto verwalten</li>
          <li class="popup-item" data-on:click="$popupOpen = false">Sicherheit</li>
          <li class="popup-item popup-item--danger" data-on:click="$popupOpen = false">
            <form method="post" action="/logout" style="display:inline">
              <button type="submit" class="btn btn-ghost" style="padding:0;width:100%;text-align:left">Abmelden</button>
            </form>
          </li>
        </ul>
      </div>
    </aside>

    <!-- ═══ Main Content ═══ -->
    <main class="main-container">
      <header class="main-header">
        <div class="header-title with-switch">Rama Platform</div>

        <div class="theme-switch-wrapper">
          <label class="theme-switch">
            <input type="checkbox" data-bind:lightMode />
            <div class="slider">
              <svg class="switch-icon switch-icon--moon" viewBox="0 0 24 24">
                <path d="M10 2c-5.52 0-10 4.48-10 10s4.48 10 10 10 10-4.48 10-10c0-1.48-.33-2.88-.9-4.14-1.48 1.86-3.75 3.08-6.3 3.08-4.42 0-8-3.58-8-8 0-2.55 1.22-4.82 3.08-6.3-.26-.06-.52-.08-.78-.08z"/>
              </svg>
              <svg class="switch-icon switch-icon--sun" viewBox="0 0 24 24">
                <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-5c.55 0 1 .45 1 1v2c0 .55-.45 1-1 1s-1-.45-1-1V3c0-.55.45-1 1-1zm0 14c.55 0 1 .45 1 1v2c0 .55-.45 1-1 1s-1-.45-1-1v-2c0-.55.45-1 1-1zM5.22 6.64l1.42-1.42c.39-.39 1.02-.39 1.41 0 .39.39.39 1.02 0 1.41L6.64 8.05c-.39.39-1.02.39-1.41 0-.39-.39-.39-1.02 0-1.41zm10.72 10.72l1.42-1.42c.39-.39 1.02-.39 1.41 0 .39.39.39 1.02 0 1.41l-1.42 1.42c-.39.39-1.02.39-1.41 0-.39-.39-.39-1.02 0-1.41zM2 12c0-.55.45-1 1-1h2c0 .55-.45 1-1 1H3c-.55 0-1-.45-1-1zm14 0c0-.55.45-1 1-1h2c.55 0 1 .45 1 1s-.45 1-1 1h-2c-.55 0-1-.45-1-1zM6.64 15.95l1.42 1.42c.39.39.39 1.02 0 1.41-.39.39-1.02.39-1.41 0l-1.42-1.42c-.39-.39-.39-1.02 0-1.41.39-.39 1.02-.39 1.41 0zm10.72-10.72l1.42 1.42c.39.39.39 1.02 0 1.41-.39.39-1.02.39-1.41 0l-1.42-1.42c-.39-.39-.39-1.02 0-1.41.39-.39 1.02-.39 1.41 0z"/>
              </svg>
            </div>
          </label>
        </div>
      </header>

      <div class="content-body">
        <h2>Welcome</h2>
        <p>Select a section from the sidebar to get started.</p>
      </div>
    </main>
  </div>

  <!-- Persistent SSE stream -->
  <div data-init="@get('/sse')"></div>

</body>
</html>
