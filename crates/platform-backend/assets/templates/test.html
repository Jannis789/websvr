<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E2E Test — Rama Platform</title>
  <link rel="stylesheet" href="/assets/css/pages/test.css">
  <script type="module" src="/assets/js/datastar-core.js"></script>
</head>
<body data-signals="{activePage:'test',popupOpen:false,lightMode:false}" data-class:light-mode="$lightMode">

  <div class="app-layout">

    <!-- ═══ Sidebar ═══ -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <span class="icon icon-display" role="img" aria-hidden="true"></span>
          <span class="sidebar-title">Rama</span>
        </div>

        <ul class="sidebar-menu">
          <li class="menu-item active"
              data-class:active="$activePage === 'test'"
              data-on:click="$activePage = 'test'">
            <span class="icon icon-view-grid" role="img" aria-hidden="true"></span>
            <span class="nav-label">Test</span>
          </li>
        </ul>
      </div>

      <!-- ═══ Sidebar Footer ═══ -->
      <div class="sidebar-footer">
        <div class="user-profile">
          <span class="avatar icon icon-person" role="img" aria-hidden="true"></span>
          <span class="username">E2E User</span>
        </div>
        <button class="settings-btn"
                data-class:active="$popupOpen"
                data-on:click="$popupOpen = !$popupOpen">
          <span class="icon icon-open-menu" role="img" aria-hidden="true"></span>
        </button>
        <div class="popup-overlay"
             data-show="$popupOpen"
             data-on:click="$popupOpen = false"></div>
        <ul class="popup-menu" data-class:popup-visible="$popupOpen">
          <li class="popup-item popup-item--danger">
            <form method="post" action="/logout" class="popup-form">
              <button type="submit" class="popup-btn" data-on:click="$popupOpen = false">
                <span class="icon icon-exit" role="img" aria-hidden="true"></span>
                Abmelden
              </button>
            </form>
          </li>
        </ul>
      </div>
    </aside>

    <main class="main-container">
      <header class="main-header">
        <div class="header-title">E2E Test Harness</div>
        <div class="theme-switch-wrapper">
          <label class="theme-switch" data-on:click="$lightMode = !$lightMode">
            <input type="checkbox" />
            <div class="slider">
              <span class="icon icon-moon switch-icon" role="img" aria-hidden="true"></span>
              <span class="icon icon-sun switch-icon" role="img" aria-hidden="true"></span>
            </div>
          </label>
        </div>
      </header>

      <div class="content-body">
        <div class="placeholder-state">
          <span class="icon icon-view-grid placeholder-icon" role="img" aria-hidden="true"></span>
          <p>E2E Test Page</p>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
