<!DOCTYPE html>
<html lang="de" data-signals="activePage:'test',popupOpen:false" data-class:light-mode="$lightMode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E2E Test — Rama Platform</title>
  <link rel="stylesheet" href="/assets/css/pages/test.css">
  <script type="module" src="/assets/js/datastar-core.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' });
    }
  </script>
</head>
<body>

  <div class="app-layout">

    <!-- ═══ Sidebar ═══ -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <div class="logo-placeholder">
            <img src="/icons/display.svg" class="logo-icon" alt="">
            <span>Rama</span>
          </div>
        </div>

        <ul class="sidebar-menu">
          <li class="menu-item active">
            <img src="/icons/multimedia.svg" class="nav-icon" alt="">
            <span class="nav-label">Test Harness</span>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="avatar">
            <img src="/icons/person.svg" alt="">
          </div>
          <div class="username">John Doe</div>
        </div>

        <button class="settings-btn"
                data-class:active="$popupOpen"
                data-on:click="$popupOpen = !$popupOpen">
          <img src="/icons/open-menu.svg" alt="Menu">
        </button>

        <div class="popup-overlay"
             data-show="$popupOpen"
             data-on:click="$popupOpen = false"></div>

        <ul class="popup-menu" data-show="$popupOpen">
          <li class="popup-item popup-item--danger">
            <form method="post" action="/logout" style="display:inline">
              <button type="submit" class="btn btn-ghost btn-logout" data-on:click="$popupOpen = false">
                <img src="/icons/exit.svg" class="popup-icon" alt="">
                Abmelden
              </button>
            </form>
          </li>
        </ul>
      </div>
    </aside>

    <!-- ═══ Main Content ═══ -->
    <main class="main-container">
      <header class="main-header">
        <div class="header-title with-switch">E2E Test Harness</div>

        <div class="theme-switch-wrapper">
          <label class="theme-switch">
            <input type="checkbox" data-bind:lightMode />
            <div class="slider">
              <img src="/icons/moon.svg" class="switch-icon switch-icon--moon" alt="">
              <img src="/icons/sun.svg" class="switch-icon switch-icon--sun" alt="">
            </div>
          </label>
        </div>
      </header>

      <div class="content-body">
        <div class="test-controls">
          <button class="btn btn-primary"
                  data-on:click="@get('/test/run')">
            Run Tests
          </button>
          <button class="btn btn-secondary"
                  data-on:click="location.reload()"
                  style="margin-left: 0.5rem;">
            Reload (test SW cache)
          </button>
          <p class="text-muted" style="margin-top: 0.5rem;">
            <strong>Reload</strong> after a test run to test the SW hash cache.
          </p>
        </div>

        <div id="test-results" class="test-results">
          <p class="text-muted">Click "Run Tests" to start the automated verification.</p>
        </div>

        <div id="test-score" class="test-score" data-show="false">
          <span id="score-value">—</span>
        </div>
      </div>
    </main>
  </div>

  <!-- Persistent SSE stream -->
  <div data-init="@get('/sse')"></div>

</body>
</html>
