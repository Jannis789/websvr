<!DOCTYPE html>
<html lang="de" data-signals="{activePage:'test',popupOpen:false,lightMode:false}" data-class:light-mode="$lightMode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E2E Test — Rama Platform</title>
  <link rel="stylesheet" href="/assets/css/pages/test.css">
  <script type="module" src="/assets/js/datastar-core.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' });
    }
  </script>
</head>
<body>

  <div class="app-layout">

    <!-- ═══ Sidebar ═══ -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <span class="icon icon-display" role="img" aria-hidden="true"></span>
          <span class="sidebar-title">Rama</span>
        </div>

        <ul class="sidebar-menu">
          <li class="menu-item active">
            <span class="icon icon-multimedia" role="img" aria-hidden="true"></span>
            <span class="nav-label">Test Harness</span>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <div class="user-profile">
          <span class="avatar icon icon-person" role="img" aria-hidden="true"></span>
          <span class="username">John Doe</span>
        </div>
        <button class="settings-btn"
                data-class:active="$popupOpen"
                data-on:click="$popupOpen = !$popupOpen">
          <span class="icon icon-open-menu" role="img" aria-hidden="true"></span>
        </button>
      </div>

      <div class="popup-overlay"
           data-show="$popupOpen"
           data-on:click="$popupOpen = false"></div>
      <ul class="popup-menu" data-show="$popupOpen">
        <li class="popup-item popup-item--danger">
          <form method="post" action="/logout">
            <button type="submit" class="btn btn-logout" data-on:click="$popupOpen = false">
              <span class="icon icon-exit" role="img" aria-hidden="true"></span>
              Abmelden
            </button>
          </form>
        </li>
      </ul>
    </aside>

    <!-- ═══ Main Content ═══ -->
    <main class="main-container">
      <header class="main-header">
        <div class="header-title">E2E Test Harness</div>
        <div class="theme-switch-wrapper">
          <label class="theme-switch">
            <input type="checkbox" data-bind:lightMode />
            <div class="slider">
              <span class="icon icon-moon switch-icon" role="img" aria-hidden="true"></span>
              <span class="icon icon-sun switch-icon" role="img" aria-hidden="true"></span>
            </div>
          </label>
        </div>
      </header>

      <div class="content-body">
        <div class="test-controls">
          <button class="btn btn-primary"
                  data-on:click="@get('/test/run')">
            Run Tests
          </button>
          <button class="btn btn-secondary"
                  data-on:click="location.reload()"
                  style="margin-left: 0.5rem;">
            Reload
          </button>
          <p class="text-muted" style="margin-top: 0.5rem;">
            <strong>Reload</strong> after a test run to test the SW hash cache.
          </p>
        </div>

        <div id="test-results" class="test-results">
          <p class="text-muted">Click "Run Tests" to start.</p>
        </div>

        <div id="test-score" class="test-score" data-show="false">
          <span id="score-value">—</span>
        </div>
      </div>
    </main>
  </div>

  <div data-init="@get('/sse')"></div>

</body>
</html>
