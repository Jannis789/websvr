<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/logo.svg">
  <title>Register — Rama Platform</title>
  <link rel="stylesheet" href="/assets/css/pages/register.css">
  <script type="module" src="/assets/js/datastar-core.js"></script>
</head>
<body data-signals="{lightMode:false, username:'', email:'', password:'', error:''}" data-class:light-mode="$lightMode">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img class="logo" src="/assets/icons/logo.svg" alt="Rama Platform" />
        <h1>Rama Platform</h1>
      </div>

      <div id="auth-feedback" data-show="$error" class="form-message message-error" data-text="$error"></div>

      <form class="auth-form" data-on:submit.prevent="@post('/register')">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required data-bind:username />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required data-bind:email />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required data-bind:password />
        </div>
        <button type="submit" class="auth-submit">Register</button>
      </form>

      <div class="auth-footer">
        <a href="/login" class="auth-link">Already have an account?</a>
        <div class="theme-switch-wrapper">
          <div class="theme-switch" data-on:click="$lightMode = !$lightMode">
            <div class="slider" data-class:checked="$lightMode">
              <span class="icon icon-moon switch-icon" role="img" aria-hidden="true"></span>
              <span class="icon icon-sun switch-icon" role="img" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
