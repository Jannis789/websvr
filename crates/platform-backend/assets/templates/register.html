<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Rama Platform</title>
  <link rel="stylesheet" href="/assets/css/pages/register.css">
  <script type="module" src="/assets/js/datastar-core.js"></script>
</head>
<body data-signals="{lightMode:false}" data-class:light-mode="$lightMode">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <span class="icon icon-display" role="img" aria-hidden="true"></span>
        <h1>Rama Platform</h1>
      </div>

      <form method="post" action="/register" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="auth-submit">Register</button>
      </form>

      <div class="auth-footer">
        <a href="/login" class="auth-link">Already have an account?</a>
        <div class="theme-switch-wrapper">
          <label class="theme-switch" data-on:click="$lightMode = !$lightMode">
            <input type="checkbox" />
            <div class="slider">
              <span class="icon icon-moon switch-icon" role="img" aria-hidden="true"></span>
              <span class="icon icon-sun switch-icon" role="img" aria-hidden="true"></span>
            </div>
          </label>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
