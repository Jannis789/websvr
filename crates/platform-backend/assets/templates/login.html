<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Rama Platform</title>
  <link rel="stylesheet" href="/assets/css/pages/login.css">
  <script type="module" src="/assets/js/datastar-core.js"></script>
</head>
<body data-signals="{lightMode:false}" data-class:light-mode="$lightMode">

  <div class="floating-window">
    <div class="app-header">
      <h1>Login</h1>
      <p class="subtitle">Sign in to your account</p>
    </div>

    <form method="post" action="/login" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="user@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <div class="auth-footer">
      <a href="/register" class="auth-link">Create account</a>
      <div class="theme-switch-wrapper">
        <label class="theme-switch">
          <input type="checkbox" data-bind:lightMode />
          <div class="slider">
            <span class="icon icon-moon switch-icon" role="img" aria-hidden="true"></span>
            <span class="icon icon-sun switch-icon" role="img" aria-hidden="true"></span>
          </div>
        </label>
      </div>
    </div>
  </div>

</body>
</html>
