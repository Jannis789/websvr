<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/logo.svg">
  <title>Login — Rama Platform</title>
  <link rel="stylesheet" href="/assets/css/pages/login.css">
  <script type="module" src="/assets/js/datastar-core.js"></script>
</head>
<body data-signals="{lightMode:false}" data-class:light-mode="$lightMode">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img class="logo" src="/assets/icons/logo.svg" alt="Rama Platform" />
        <h1>Rama Platform</h1>
      </div>

      <form method="post" action="/login" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="auth-submit">Login</button>
      </form>

      <div class="auth-footer">
        <a href="/register" class="auth-link">Create account</a>
        <div class="theme-switch-wrapper">
          <div class="theme-switch" data-on:click="$lightMode = !$lightMode">
            <div class="slider" data-class:checked="$lightMode">
              <span class="icon icon-moon switch-icon" role="img" aria-hidden="true"></span>
              <span class="icon icon-sun switch-icon" role="img" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
